[pytest]
# Los tests viven junto a la aplicación y usan importaciones absolutas
# (`from app... import ...`), resolviendo `app` desde tbs-webui/ (ver conftest.py).
testpaths = tbs-webui/tests
python_files = test_*.py
addopts = -ra --strict-markers
markers =
    slow: pruebas que tardan más de un segundo
    hardware: requieren tarjeta DVB real (/dev/dvb)
