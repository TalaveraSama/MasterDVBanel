# TBS WebUI — proxy inverso con Nginx (OPCIONAL).
#
# Se instala como /etc/nginx/sites-available/tbs-webui.conf.
# `deploy/install.sh --nginx --enable-nginx --server-name panel.mired` lo copia
# y sustituye los marcadores automáticamente.
#
# Instalación manual:
#   sudo cp deploy/nginx-tbs-webui.conf /etc/nginx/sites-available/tbs-webui.conf
#   sudo sed -i "s|__TBS_SERVER_NAME__|panel.mired|" /etc/nginx/sites-available/tbs-webui.conf
#   sudo ln -s /etc/nginx/sites-available/tbs-webui.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# AVISOS IMPORTANTES
#  - Las directivas `upstream` y `map` pertenecen al contexto `http`. En Ubuntu
#    /etc/nginx/sites-enabled/* se incluye dentro de `http`, así que funciona
#    tal cual; no metas este fichero dentro de un bloque `server`.
#  - No añadas `listen 80 default_server` aquí si ya hay otro sitio con
#    `default_server` (el `default` de Ubuntu): Nginx fallará al recargar.
#    Usa un `server_name` propio o cambia el puerto.
#  - El panel sirve la SPA en `/` y el WebSocket en `/ws/signal`: el proxy debe
#    reenviar las cabeceras Upgrade/Connection o las barras en vivo no funcionan.
#  - Con HTTPS (certbot) recuerda poner TBS_SECURE_COOKIES=1 y reiniciar el
#    servicio; si no, el navegador descartará las cookies.

# Nombre del backend local (uvicorn escuchando en 127.0.0.1:9000).
upstream tbs_webui_backend {
    server 127.0.0.1:__TBS_BACKEND_PORT__;
    keepalive 8;
}

# WebSocket: convierte la cabecera Upgrade en Connection: upgrade (o close).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    # __TBS_SERVER_NAME__ lo sustituye install.sh (por defecto "_" = cualquiera).
    server_name __TBS_SERVER_NAME__;

    access_log /var/log/nginx/tbs-webui.access.log;
    error_log  /var/log/nginx/tbs-webui.error.log;

    # Margen para el cuerpo de las peticiones (filtros/borrados masivos).
    client_max_body_size 8m;
    client_body_timeout 60s;

    # Cabeceras reales del cliente: el límite de intentos de login por IP y los
    # registros usan X-Forwarded-For (app/deps.py: client_ip).
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # --- SPA + API -----------------------------------------------------------
    location / {
        proxy_pass http://tbs_webui_backend;
        proxy_http_version 1.1;
        # Los escaneos se lanzan en segundo plano y se consultan por polling,
        # pero el alta de una tabla grande puede tardar: margen amplio.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering on;
    }

    # --- WebSocket de señal (500 ms) -----------------------------------------
    location /ws/signal {
        proxy_pass http://tbs_webui_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Conexión de larga duración: sin buffering y sin timeouts prácticos.
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    # --- Salud (útil para monitorización; no ensucia el access_log) ----------
    location = /api/health {
        proxy_pass http://tbs_webui_backend;
        proxy_http_version 1.1;
        access_log off;
    }
}

# --- HTTPS con Let's Encrypt (recomendado en LAN/WAN) ------------------------
#   sudo apt install certbot python3-certbot-nginx
#   sudo certbot --nginx -d panel.mired
# Después:
#   echo 'TBS_SECURE_COOKIES=1' | sudo tee -a /etc/tbs-webui/tbs-webui.env
#   sudo systemctl restart tbs-webui
#   sudo systemctl reload nginx
#
# Publicar el panel en una SUBRUTA (por ejemplo https://host/tbs/) no está
# soportado por esta versión: TBS_ROOT_PATH se lee en app/config.py pero la
# aplicación no lo aplica al montar la SPA ni los estáticos. Usa un puerto, un
# subdominio o un `server_name` distinto.
